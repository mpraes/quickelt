version: '3.8'

# =============================================================================
# QUICKELT INFRASTRUCTURE SETUP / CONFIGURAÇÃO DE INFRAESTRUTURA QUICKELT
# =============================================================================
# Este docker-compose configura a infraestrutura necessária para o projeto
# QuickELT, incluindo MinIO para storage S3-compatible e PostgreSQL para
# armazenamento de dados estruturados.
#
# This docker-compose sets up the necessary infrastructure for the QuickELT
# project, including MinIO for S3-compatible storage and PostgreSQL for
# structured data storage.
#
# COMO USAR / HOW TO USE:
# 1. Navegue até o diretório infrastructure/ 
#    Navigate to the infrastructure/ directory
# 2. Execute: docker-compose up -d
# 3. Configure as variáveis no .env do projeto principal
#    Configure variables in the main project .env file
# 4. Use os templates de ingestão S3 e database do QuickELT
#    Use the QuickELT S3 and database ingestion templates
# =============================================================================

services:
  # PostgreSQL - Banco de dados principal para dados estruturados
  # PostgreSQL - Main database for structured data
  postgres:
    image: postgres:15-alpine
    container_name: quickelt-postgres
    environment:
      # Configurações padrão que devem ser espelhadas no .env principal
      # Default configurations that should be mirrored in the main .env
      POSTGRES_DB: quickelt_db
      POSTGRES_USER: quickelt_user  
      POSTGRES_PASSWORD: quickelt_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monte scripts de inicialização se necessário
      # Mount initialization scripts if needed
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      # Porta padrão PostgreSQL - use nos templates database_template.py
      # Default PostgreSQL port - use in database_template.py templates
      - "5432:5432"
    networks:
      - quickelt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickelt_user -d quickelt_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO - Storage S3-compatible para data lake (bronze/silver/gold)
  # MinIO - S3-compatible storage for data lake (bronze/silver/gold)
  minio:
    image: minio/minio:latest
    container_name: quickelt-minio
    environment:
      # Credenciais que devem ser configuradas no .env principal
      # Credentials that should be configured in the main .env
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      # 9000: API S3 - use nos templates s3_template.py com endpoint local
      # 9000: S3 API - use in s3_template.py templates with local endpoint
      - "9000:9000"
      # 9001: Console Web - acesse http://localhost:9001 para gerenciar buckets
      # 9001: Web Console - access http://localhost:9001 to manage buckets
      - "9001:9001"
    networks:
      - quickelt-network
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Persistência de dados para evitar perda ao reiniciar containers
  # Data persistence to avoid loss when restarting containers
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  # Rede isolada para comunicação entre serviços
  # Isolated network for inter-service communication
  quickelt-network:
    driver: bridge

# =============================================================================
# CONFIGURAÇÃO NO PROJETO PRINCIPAL / MAIN PROJECT CONFIGURATION
# =============================================================================
# Após subir a infraestrutura, configure seu .env principal com:
# After starting the infrastructure, configure your main .env with:
#
# # Database Configuration (PostgreSQL local)
# POSTGRES_HOST=localhost
# POSTGRES_PORT=5432
# POSTGRES_USERNAME=quickelt_user
# POSTGRES_PASSWORD=quickelt_password
# POSTGRES_DATABASE=quickelt_db
#
# # MinIO Configuration (S3-compatible local)
# AWS_ENDPOINT_URL=http://localhost:9000  # Para desenvolvimento local
# AWS_ACCESS_KEY_ID=minioadmin
# AWS_SECRET_ACCESS_KEY=minioadmin123
# AWS_REGION=us-east-1
# AWS_S3_BUCKET=quickelt-data  # Criar no console MinIO
#
# COMANDOS ÚTEIS / USEFUL COMMANDS:
# - Iniciar infraestrutura: docker-compose up -d
# - Parar infraestrutura: docker-compose down
# - Ver logs: docker-compose logs -f
# - Resetar dados: docker-compose down -v
# - Acessar PostgreSQL: docker exec -it quickelt-postgres psql -U quickelt_user -d quickelt_db
#
# INTEGRAÇÃO COM TEMPLATES QUICKELT / QUICKELT TEMPLATES INTEGRATION:
# - Use database_template.py para ingestão no PostgreSQL
# - Use s3_template.py para operações no MinIO (data lake)
# - Configure AWS_ENDPOINT_URL para desenvolvimento local
# - Mantenha a estrutura bronze/silver/gold no bucket MinIO
# =============================================================================