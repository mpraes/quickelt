[project]
name = "quickelt"
version = "0.1.0"
description = "Ingestão e transformação de dados / Data ingestion and transformation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.2",
    "polars>=0.20.28",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.30",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "duckdb>=0.9.1",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "oracledb>=2.1.0",
    "pyodbc>=5.0.1",
    "msal>=1.26.0",
    "openpyxl>=3.1.2",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "tenacity>=8.2.3",
    "tqdm>=4.66.2",
    "lxml>=4.9.3",
    "pyarrow>=15.0.1",
    "fastparquet>=2024.2.0",
    "pydantic>=2.0.0",
    "inquirer>=3.2.0",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
