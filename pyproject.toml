[project]
name = "quickelt"
version = "0.1.0"
description = "Scaffold Production-Ready Lakehouses in seconds"
authors = [
    { name = "Renan Moura", email = "renan@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lakehouse", "data-engineering", "elt", "cli", "scaffold", "medallion-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Database",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.2.0",
    "questionary>=2.0.0",
]

[project.scripts]
quickelt = "quickelt.cli:app"

[project.urls]
Homepage = "https://github.com/mpraes/quickelt"
Repository = "https://github.com/mpraes/quickelt"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
